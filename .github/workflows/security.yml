name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Enforced for everything that ships at runtime. Build-only tools (Tailwind,
      # ESLint, Jest) are excluded with --omit=dev: they never run inside the board.
      - name: Run npm audit (board, runtime)
        run: npm audit --omit=dev

      - name: Run npm audit (ws)
        if: ${{ !cancelled() }} # still runs when the board audit fails
        run: npm --prefix ws ci && npm --prefix ws audit --omit=dev
