name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch cancels that PR's older runs. Pushes to main always
# run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.x'

# ws runs on your own machine against folders of markdown files, so there is
# nothing to deploy and no credentials to inject. CI proves the board lints,
# typechecks, tests and builds, and that the ws CLI, hooks, summarizer, setup and
# MCP server pass their own suite.

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  ws:
    name: ws CLI, hooks, summarizer, MCP (${{ matrix.os }}, ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22.x', '24.x']
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ws/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Uses temp WS_ROOTs and a fake model endpoint; never touches real data.
      - name: Test
        run: npm test

  # Native Windows isn't supported (docs/WINDOWS.md): ws refuses it cleanly, and its
  # hooks exit 0 so a session is never broken. This job keeps that promise true.
  windows:
    name: Native Windows is refused cleanly (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ws/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Platform tests
        run: node --test test/platform.test.mjs
